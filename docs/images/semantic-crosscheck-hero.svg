<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">semantic-crosscheck — 설정 하나, 네 계층, 교차 검증</title>
  <desc id="desc">crosscheck.toml에서 PostgreSQL, SHACL, OWL과 HermiT, Cube를 생성하고 gold SQL과 함께 비교하는 구조. 하단은 가상 BOM 데모의 report 기대 출력을 설명하는 정적 그림이다.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c35"/>
      <stop offset="1" stop-color="#141326"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#dbeafe" stroke-opacity="0.045"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#background)"/>
  <rect width="1200" height="560" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="558" rx="23" fill="none" stroke="#334155"/>
  <rect x="50" y="39" width="56" height="5" rx="2.5" fill="url(#accent)"/>
  <g font-family="Segoe UI, Noto Sans KR, Malgun Gothic, sans-serif">
    <text x="50" y="90" fill="#f8fafc" font-size="36" font-weight="750">semantic-crosscheck</text>
    <text x="51" y="124" fill="#cbd5e1" font-size="21">설정 하나. 네 계층. 같은 질문을 서로의 답으로 검증합니다.</text>
    <rect x="900" y="52" width="244" height="34" rx="17" fill="#1e293b" stroke="#475569"/>
    <text x="1022" y="74" text-anchor="middle" fill="#c4b5fd" font-size="15" font-weight="650">CLI · Claude Code · Codex</text>
    <rect x="50" y="152" width="258" height="39" rx="10" fill="#312e81" stroke="#818cf8"/>
    <text x="179" y="178" text-anchor="middle" fill="#eef2ff" font-size="18" font-weight="650">crosscheck.toml</text>
    <text x="333" y="177" fill="#94a3b8" font-size="17">모델 · 규칙 · 질의 설정</text>
    <rect x="826" y="150" width="320" height="42" rx="10" fill="#162a2b" stroke="#2dd4bf"/>
    <text x="986" y="177" text-anchor="middle" fill="#99f6e4" font-size="18" font-weight="600">gold SQL · 별도로 작성한 기준</text>
    <path d="M179 192V205H1029M179 205V218M463 205V218M745 205V218M1029 205V218" fill="none" stroke="#64748b" stroke-width="1.8"/>
    <g>
      <rect x="50" y="224" width="258" height="98" rx="14" fill="#132c4b" stroke="#60a5fa"/>
      <text x="70" y="257" fill="#bfdbfe" font-size="22" font-weight="700">PostgreSQL 17+</text>
      <text x="70" y="286" fill="#dbeafe" font-size="17">계층 폐포 · SQL 위반 뷰</text>
      <text x="70" y="310" fill="#93c5fd" font-size="14">build</text>
      <rect x="334" y="224" width="258" height="98" rx="14" fill="#122e29" stroke="#4ade80"/>
      <text x="354" y="257" fill="#bbf7d0" font-size="22" font-weight="700">SHACL</text>
      <text x="354" y="286" fill="#dcfce7" font-size="17">데이터 규칙 · 위반 키 대조</text>
      <text x="354" y="310" fill="#86efac" font-size="14">reason</text>
      <rect x="618" y="224" width="258" height="98" rx="14" fill="#2b1d41" stroke="#c084fc"/>
      <text x="638" y="257" fill="#e9d5ff" font-size="22" font-weight="700">OWL + HermiT</text>
      <text x="638" y="286" fill="#f3e8ff" font-size="17">일관성 · 관계 · 분류</text>
      <text x="638" y="310" fill="#d8b4fe" font-size="14">reason · V5</text>
      <rect x="902" y="224" width="244" height="98" rx="14" fill="#3b1c31" stroke="#fb7185"/>
      <text x="922" y="257" fill="#fecdd3" font-size="22" font-weight="700">Cube Core</text>
      <text x="922" y="286" fill="#ffe4e6" font-size="17">지표 · 조인 · 집계</text>
      <text x="922" y="310" fill="#fda4af" font-size="14">cube · verify</text>
    </g>
    <path d="M179 322V348H1024V322M463 322V348M745 322V348M602 348V372" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M1146 172H1165V348H1024" fill="none" stroke="#2dd4bf" stroke-width="1.6" stroke-dasharray="5 5"/>
    <rect x="50" y="382" width="1096" height="141" rx="14" fill="#090f1c" stroke="#475569"/>
    <circle cx="76" cy="405" r="5" fill="#fb7185"/>
    <circle cx="94" cy="405" r="5" fill="#fbbf24"/>
    <circle cx="112" cy="405" r="5" fill="#4ade80"/>
    <text x="138" y="410" fill="#94a3b8" font-size="15">가상 BOM 데모 · report 기대 출력</text>
    <g font-family="Cascadia Code, Consolas, monospace" font-size="18">
      <text x="75" y="445" fill="#94a3b8">$ sxc.py report --config demo/crosscheck.toml</text>
      <text x="75" y="476" fill="#4ade80">[sxc report] PASS</text>
      <text x="284" y="476" fill="#cbd5e1">checks: 6 pass, 0 fail, 0 error, 0 not_run</text>
    </g>
    <text x="75" y="505" fill="#cbd5e1" font-size="16">결과에서 확인할 정보: 검사 ID · 건수 · config_ref · not_proven · 다음 행동</text>
    <text x="50" y="545" fill="#94a3b8" font-size="14">원본 조회와 생성 스키마 기록을 분리합니다. PASS는 수행한 검사와 입력 데이터의 범위에 한합니다.</text>
  </g>
</svg>
