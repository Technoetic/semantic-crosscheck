name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install core requirements
        run: python -m pip install --disable-pip-version-check -r requirements/core.txt -r requirements/witness.txt
      - name: Command line starts
        run: python skills/semantic-crosscheck/scripts/sxc.py --version
      # Core and optional witness requirements are installed here: database tests skip without SXC_TEST_ADMIN_DSN, and
      # tests that need the reason packages or the Cube adapter skip when those are absent.
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q skills/semantic-crosscheck/scripts tests tools

  integration:
    name: integration / PostgreSQL 17, HermiT, Cube, Jena, demo end to end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          # Throw-away password for a container that exists only for this job. It is an expression so
          # that no literal credential is committed (tools/leak_scan.py rejects literal passwords).
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONUTF8: '1'
      PGPASSWORD: ci-${{ github.run_id }}-admin
      SXC_TEST_ADMIN_DSN: postgresql://postgres@127.0.0.1:5432/postgres
      SXC_TEST_ROLE_PASSWORD: ci-${{ github.run_id }}-roles
      # Registers the actual-runtime end-to-end tests only in this provisioned job.
      # Missing prerequisites fail those tests; they never skip in this job.
      SXC_TEST_FULLSTACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          java-package: jre
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Point the tests at Java and the Cube install directory
        run: |
          echo "SXC_JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
          echo "SXC_CUBE_HOME=$RUNNER_TEMP/sxc-cube" >> "$GITHUB_ENV"
      - name: Install reason requirements
        run: python -m pip install --disable-pip-version-check -r requirements/reason.txt -r requirements/witness.txt
      - name: Install the verified Apache Jena distribution
        run: |
          python - <<'EOF'
          import hashlib
          import io
          import os
          from pathlib import Path
          import urllib.request
          import zipfile

          url = "https://archive.apache.org/dist/jena/binaries/apache-jena-6.2.0.zip"
          # Published Apache SHA-512, independently verified before pinning.
          expected = ("fb97634215b4667124bdbe4f42efc25d4dc4e9046b70bfa702d7a71e1a8aed049"
                      "ec79a38eb469cf0e13b18724cc024adec3cc35113a24e8fa62aa66091d7431e")
          with urllib.request.urlopen(url, timeout=60) as response:
              archive = response.read(64 * 1024 * 1024 + 1)
          # Not assert: python -O would strip the checks and extract an unverified archive.
          if len(archive) > 64 * 1024 * 1024:
              raise SystemExit("Jena archive exceeds the download limit")
          if hashlib.sha512(archive).hexdigest() != expected:
              raise SystemExit("Jena archive checksum mismatch")
          destination = Path(os.environ["RUNNER_TEMP"]) / "sxc-jena"
          destination.mkdir()
          with zipfile.ZipFile(io.BytesIO(archive)) as package:
              package.extractall(destination)
          home = destination / "apache-jena-6.2.0"
          assert (home / "lib" / "jena-shacl-6.2.0.jar").is_file(), "Jena SHACL is missing"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"SXC_JENA_HOME={home}\n")
          print("Apache Jena 6.2.0: archive checksum verified")
          EOF
      # Test-time only: the W3C Software and Document License suite is read in place, never committed.
      - name: Fetch the pinned W3C SHACL test suite
        run: |
          python - <<'EOF'
          import hashlib
          import io
          import os
          from pathlib import Path
          import tarfile
          import urllib.request

          commit = "1dfcd9f30cab70ac02b049611eeba451fa1308e7"
          url = f"https://codeload.github.com/w3c/data-shapes/legacy.tar.gz/{commit}"
          # SHA-256 of this commit's GitHub source tarball, verified before pinning. Should GitHub ever
          # regenerate the bytes, this fails closed; shacl-corpus separately checks the extracted content.
          # To re-pin: download the archive, check that load_w3c_suite on its extract still gives
          # shacl_corpus.W3C_SUITE_SHA256, and only then replace this archive checksum.
          expected = "6213a0a58b9fd812b9659d9c0ceba67448f449fc4ebe22a459f1fe3e778c3646"
          with urllib.request.urlopen(url, timeout=60) as response:
              archive = response.read(32 * 1024 * 1024 + 1)
          if len(archive) > 32 * 1024 * 1024:
              raise SystemExit("W3C suite archive exceeds the download limit")
          if hashlib.sha256(archive).hexdigest() != expected:
              raise SystemExit("W3C suite archive checksum mismatch")
          destination = Path(os.environ["RUNNER_TEMP"]) / "sxc-w3c-data-shapes"
          destination.mkdir()
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as package:
              members = []
              for member in package.getmembers():
                  parts = member.name.split("/", 1)
                  if len(parts) != 2 or not (member.isfile() or member.isdir()):
                      continue
                  if parts[1] == "LICENSE.md" or parts[1].startswith("data-shapes-test-suite/"):
                      member.name = parts[1]
                      members.append(member)
              package.extractall(destination, members=members, filter="data")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"SXC_W3C_SHACL_SUITE={destination}\n")
          print("W3C data-shapes test suite: archive checksum verified")
          EOF
      - name: Install the pinned Cube adapter
        run: python skills/semantic-crosscheck/scripts/sxc.py cube-install
      # Fail here instead of letting the integration tests skip silently.
      - name: Integration prerequisites are live
        working-directory: tests
        run: |
          python - <<'EOF'
          import os
          from pathlib import Path
          import subprocess

          import pgfixture
          from semantic_crosscheck import cube_run, db, shacl_corpus

          os.environ["SXC_CI_PROBE_DSN"] = os.environ["SXC_TEST_ADMIN_DSN"]
          conn = db.connect("SXC_CI_PROBE_DSN")
          try:
              assert db.server_version_num(conn) >= 170000, "PostgreSQL 17 or later is required"
          finally:
              conn.close()
          assert Path(os.environ["SXC_JAVA"]).is_file(), "SXC_JAVA does not name a file"
          assert cube_run.installed(cube_run.cube_home()), "the Cube adapter is not installed"
          jena = Path(os.environ["SXC_JENA_HOME"])
          version = subprocess.run([os.environ["SXC_JAVA"], "-cp", str(jena / "lib" / "*"),
                                    "shacl.shacl", "version"], check=True, capture_output=True,
                                   text=True, timeout=30)
          assert "Apache Jena SHACL version 6.2.0" in version.stdout + version.stderr, "Jena cannot execute"
          suite = shacl_corpus.load_w3c_suite(os.environ["SXC_W3C_SHACL_SUITE"])
          if suite.sha256 != shacl_corpus.W3C_SUITE_SHA256:
              raise SystemExit("the W3C suite is not the pinned content")
          print("integration prerequisites: ok")
          EOF
      # The roles template exactly as the README runs it: psql, a superuser, four psql variables. The two roles
      # get the job's throw-away password afterwards (a person sets theirs with \password instead).
      - name: Demo database and roles from docs/setup-roles.sql
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
        run: |
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          psql --version
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE sxc_demo_db"
          psql -d sxc_demo_db -v loader_role=sxc_loader -v check_role=sxc_check \
               -v source_schema=sxc_demo -v output_schema=sxc_out -f docs/setup-roles.sql
          psql -d sxc_demo_db -v ON_ERROR_STOP=1 -v pw="$SXC_TEST_ROLE_PASSWORD" <<'SQL'
          ALTER ROLE sxc_loader PASSWORD :'pw';
          ALTER ROLE sxc_check PASSWORD :'pw';
          SQL
      - name: Unit and integration tests (no skips)
        run: |
          python - <<'EOF'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"integration tests: run={result.testsRun}, skipped={len(result.skipped)}, "
                f"failures={len(result.failures)}, errors={len(result.errors)}")
          if result.skipped:
              for test, reason in result.skipped:
                  print(f"::error::skipped {test.id()}: {reason}")
          sys.exit(0 if result.wasSuccessful() and result.testsRun > 0 and not result.skipped else 1)
          EOF
      # The README quick start through the command line with the roles above: the clean demo passes every stage,
      # the dirty variant fails build and report on purpose.
      - name: Demo end to end
        env:
          SXC_PG_OWNER_DSN: postgresql://sxc_loader@127.0.0.1:5432/sxc_demo_db
          SXC_PG_DSN: postgresql://sxc_check@127.0.0.1:5432/sxc_demo_db
          PGPASSWORD: ci-${{ github.run_id }}-roles
        run: |
          expect() {
            want=$1
            shift
            set +e
            "$@"
            got=$?
            set -e
            if [ "$got" -ne "$want" ]; then
              echo "::error::exit code $got instead of $want: $*"
              exit 1
            fi
          }
          expect 0 python skills/semantic-crosscheck/scripts/sxc.py demo --config demo/crosscheck.toml --variant clean
          expect 0 python skills/semantic-crosscheck/scripts/sxc.py doctor --config demo/crosscheck.toml --require core,reason,cube
          expect 0 python skills/semantic-crosscheck/scripts/sxc.py build --config demo/crosscheck.toml
          expect 0 python skills/semantic-crosscheck/scripts/sxc.py reason --config demo/crosscheck.toml
          expect 0 python skills/semantic-crosscheck/scripts/sxc.py cube --config demo/crosscheck.toml
          expect 0 python skills/semantic-crosscheck/scripts/sxc.py verify --config demo/crosscheck.toml
          expect 0 python skills/semantic-crosscheck/scripts/sxc.py report --config demo/crosscheck.toml
          expect 0 python skills/semantic-crosscheck/scripts/sxc.py demo --config demo/crosscheck.toml --variant dirty
          expect 1 python skills/semantic-crosscheck/scripts/sxc.py build --config demo/crosscheck.toml
          expect 1 python skills/semantic-crosscheck/scripts/sxc.py reason --config demo/crosscheck.toml
          expect 1 python skills/semantic-crosscheck/scripts/sxc.py report --config demo/crosscheck.toml

  hygiene:
    name: whitespace and leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The whole history: the leak scan reads every commit, path and ref name, not only the last tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Compare the committed tree with git's empty tree so every tracked file is checked; a bare
      # `git diff --check` only compares the working tree with the index, which is clean after checkout.
      - name: Whitespace validation (whole committed tree)
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
      # Generic patterns and tools/leak-allow.txt only. A deny-list never exists in CI: SXC_DENYLIST=none says so.
      - name: Leak scan (working tree and whole history)
        env:
          SXC_DENYLIST: none
        run: python tools/leak_scan.py --worktree --history
